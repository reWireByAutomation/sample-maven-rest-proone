steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 11
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '11'
      cache: 'maven'

  - name: Cache Maven repository (additional layer)
    uses: actions/cache@v4
    with:
      path: ~/.m2/repository
      key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      restore-keys: |
        ${{ runner.os }}-maven-

  - name: Run smoke tests
    env:
      MAVEN_OPTS: -Xmx2G
    run: mvn clean compile test -Dcucumber.filter.tags=@smoke

  - name: Upload Surefire / Cucumber reports
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: test-reports
      path: |
        target/surefire-reports
        target/failsafe-reports
        target/cucumber-reports
        target/*.xml